name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'vpsguard/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'vpsguard/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpsguard/agent
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: vpsguard/agent/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff
      - name: Lint
        run: ruff check vpsguard_agent tests
      - name: Test
        run: pytest -q

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpsguard/server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vpsguard
          POSTGRES_PASSWORD: vpsguard
          POSTGRES_DB: vpsguard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vpsguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vpsguard/server/package.json
      - name: Install
        run: npm install
      - name: Test
        run: npm test -- --passWithNoTests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: vpsguard
          POSTGRES_PASSWORD: vpsguard
          POSTGRES_DB: vpsguard
      - name: Build
        run: npm run build

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpsguard/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vpsguard/dashboard/package.json
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_WS_URL: http://localhost:4000

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [agent, server, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: vpsguard/server
          push: false
          tags: vpsguard/server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: vpsguard/dashboard
          push: false
          tags: vpsguard/dashboard:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000
            NEXT_PUBLIC_WS_URL=http://localhost:4000
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: vpsguard/agent
          push: false
          tags: vpsguard/agent:ci
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

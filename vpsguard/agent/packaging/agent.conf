# VPSGuard agent configuration.
# Install to /etc/vpsguard/agent.conf with mode 0600 (it contains the API key).
# Every value below is the built-in default unless stated otherwise.

[server]
# Base URL of the VPSGuard server. Metrics are posted to <url>/api/v1/ingest.
url = https://monitor.example.com
# API key issued by the VPSGuard server.
api_key = YOUR_API_KEY

[agent]
# Fast tier interval in seconds (cpu, memory, disk, network, processes,
# connections, docker, services, uptime).
interval = 30
# Slow tier interval in seconds (temperature, smart, ssl, logs, security).
# Slow results are cached and merged into every payload.
slow_interval = 300
# debug | info | warning | error | critical
log_level = info
# Maximum number of payloads kept in the offline buffer.
buffer_size = 1000
# Buffered payloads older than this are discarded.
buffer_retention_hours = 24
# Allow the server to run remote commands on this host.
allow_commands = true
# Unprivileged user that sandboxed commands (run_script) are executed as.
command_user = vpsguard
# Hard timeout for a single remote command, in seconds.
command_timeout = 60
# Verify the server's TLS certificate. Never disable this in production.
verify_tls = true

# --- Optional tuning -------------------------------------------------------
# State directory (offline buffer + server_id).
# state_dir = /var/lib/vpsguard
# Log directory for the rotating agent log.
# log_dir = /var/log/vpsguard
# Number of processes reported in the "processes" metric.
# top_processes = 10
# Cache lifetime for fast-tier collectors that shell out (docker, services).
# subprocess_refresh_seconds = 60
# HTTP timeout in seconds.
# request_timeout = 10

[metrics]
cpu = true
memory = true
disk = true
network = true
processes = true
docker = true
security = true
ssl = true
logs = true
services = true
temperature = true
smart = true

[logs]
# Comma-separated list of log files to scan (only new lines are counted).
files = /var/log/syslog,/var/log/auth.log
# Case-insensitive substrings to look for.
patterns = error,critical,failed,denied
# Maximum number of lines inspected per file and cycle.
max_lines = 2000

[ssl]
# Comma-separated host:port list. The port defaults to 443 when omitted.
domains = example.com:443

groups:
  - name: server_alerts
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High CPU usage"
          description: "CPU usage > 90% for 5 minutes ({{ $value | printf \"%.1f\" }}%)"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "RAM usage > 95% ({{ $value | printf \"%.1f\" }}%)"

      - alert: LowDiskSpace
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|aufs|rootfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|aufs|rootfs"}
          ) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Free space on {{ $labels.mountpoint }} < 15% ({{ $value | printf \"%.1f\" }}%)"

      - alert: NodeExporterDown
        expr: up{job="node_exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter is down"
          description: "Prometheus cannot scrape Node Exporter (instance: {{ $labels.instance }})"
